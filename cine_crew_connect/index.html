<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Crew Connect - Home</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header class="header">
        <div class="logo">Cine Crew Connect</div>
        <div class="nav-buttons">
            <button class="btn" id="login-btn">Login</button>
            <button class="btn" id="register-btn">Register</button>
        </div>
    </header>

    <section class="search-section">
        <h1>Welcome to Cine Crew Connect</h1>
        <p>Find your next opportunity in the film industry!</p>

        <!-- Search by Name -->
        <div class="search-bar">
            <input type="text" id="search-name" placeholder="Search profiles by name...">
            <button id="search-btn" class="btn">Search</button>
        </div>

        <!-- Filter by Role -->
        <div class="filter-bar">
            <label for="role-select">Filter by Role:</label>
            <select id="role-select">
                <option value="all">All</option>
                <option value="editor">Editor</option>
                <option value="animator">Animator</option>
                <option value="sound_engineer">Sound Engineer</option>
                <option value="graphic_designer">Graphic Designer</option>
                <option value="cameraman">Cameraman</option>
            </select>
            <button id="filter-btn" class="btn">Filter</button>
        </div>
    </section>
    <section class="profiles-section">
        <h2>Profiles</h2>
        <div id="profiles-container" class="profiles-container">
            <!-- Profiles will be injected here dynamically -->
        </div>
    </section>
    
   

    <script src="js/home.js" defer></script>

    
</body>
</html>
